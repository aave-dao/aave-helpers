name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    uses: aave-dao/github-workflows/.github/workflows/foundry-lint-prettier.yml@main
  test:
    uses: aave-dao/github-workflows/.github/workflows/foundry-test.yml@main
    secrets:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  test-base:
    name: Foundry test (--network base)
    runs-on: ubuntu-latest
    env:
      # Upstream foundry nightly with native Base execution (foundry-rs/foundry#16809 and #16224). Bump
      # the tag and checksum together; move to a stable release once one ships the Base network. The
      # `base:Beryl` hardfork below must become `base:Cobalt` once the forked blocks pass
      # 2026-09-30T10:00Z (Base mainnet Cobalt activation, timestamp 1790791200).
      FOUNDRY_NIGHTLY: nightly-cc29fe1ce8ba9366dc3bdb57ddf790d51420cfd5
      FOUNDRY_SHA256: 3bea287e11b92cf8144a0d0aaffe8cba9fe9dc6d7bcaf88c8d1375f060ae4ee7
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # Base B20 tokens and the B20 factory are node-native precompiles (account code 0xef). Stable
      # forge cannot execute them, so the B20 deal tests self-skip in the job above and only run here,
      # under a forge that selects the Base EVM with `--network base`. No `--chain-id`: it would override
      # `block.chainid` on the mainnet and gnosis forks in the same files; the Base fork supplies 8453.
      - name: Install foundry nightly
        run: |
          set -euo pipefail
          f=foundry_nightly_linux_amd64.tar.gz
          curl -sSfLO "https://github.com/foundry-rs/foundry/releases/download/$FOUNDRY_NIGHTLY/$f"
          echo "$FOUNDRY_SHA256  $f" | sha256sum -c -
          mkdir -p "$HOME/.foundry-base" && tar -xzf "$f" -C "$HOME/.foundry-base" forge
          echo "$HOME/.foundry-base" >> "$GITHUB_PATH"
          "$HOME/.foundry-base/forge" --version

      - name: Run B20 deal tests
        run: forge test --network base --hardfork base:Beryl --match-path 'tests/CommonTestBase*.t.sol' -vv
        env:
          FOUNDRY_PROFILE: default
          FOUNDRY_DISABLE_NIGHTLY_WARNING: '1'
